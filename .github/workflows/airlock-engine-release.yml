name: airlock-engine-release

# Build the airlock-branded engine from an overlay tag and publish per-platform
# artifacts as a GitHub Release on this fork. Consumed by airlock's build.sh
# (fetch_engine). Runs on GitHub runners — the airlock target never sees Bun/Node.
on:
  workflow_dispatch:
    inputs:
      overlay_tag:
        description: "overlay tag to build and release (e.g. airlock-v1.17.3-1)"
        required: true
        default: airlock-v1.17.3-1

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout overlay tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.overlay_tag }}

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Derive engine base version from the overlay tag
        run: |
          base="$(printf '%s' '${{ inputs.overlay_tag }}' | sed -E 's/^airlock-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$/\1/')"
          echo "OPENCODE_VERSION=${base}" >> "$GITHUB_ENV"
          echo "engine base version: ${base}"

      - name: Build engine (all platforms, TUI; web UI skipped)
        run: bun packages/opencode/script/build.ts --skip-embed-web-ui

      - name: Verify branding (fail loud if any platform is not airlock-branded)
        run: |
          set -euo pipefail
          for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            bin="packages/opencode/dist/opencode-${plat}/bin/opencode"
            [ "$plat" = "windows-x64" ] && bin="packages/opencode/dist/opencode-windows-x64/bin/opencode.exe"
            [ -f "$bin" ] || { echo "missing build output for ${plat}"; exit 1; }
            # REQUIRE the airlock terminal-title; FORBID the upstream wordmark art row.
            LC_ALL=C grep -aqF 'setTerminalTitle("airlock")' "$bin" || { echo "[$plat] MISSING airlock title"; exit 1; }
            if LC_ALL=C grep -aqF '█▀▀█ █▀▀█ █▀▀█ █▀▀▄' "$bin"; then echo "[$plat] upstream wordmark art present"; exit 1; fi
            echo "[$plat] branding OK"
          done

      - name: License gate self-test (built binary must enforce; real minisign)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          bin="packages/opencode/dist/opencode-linux-x64/bin/opencode"
          T="$(mktemp -d)"
          minisign -G -f -W -p "$T/airlock.pub" -s "$T/airlock.key"
          mk() { # <expiry> <dir>
            mkdir -p "$2"
            printf 'licensee=SelfTest Corp\ncontract=CT-0001\nexpiry=%s\n' "$1" > "$2/license.txt"
            minisign -S -s "$T/airlock.key" -m "$2/license.txt" -x "$2/license.txt.minisig"
            cp "$T/airlock.pub" "$2/airlock.pub"
          }
          # 1) no license dir -> enforcement off (open build behavior)
          out="$(AIRLOCK_LICENSE_DIR="$T/none" AIRLOCK_LICENSE_SELFTEST=1 "$bin" stats)"
          [ "$out" = "license-ok" ] || { echo "FAIL: missing-verifier should be unlicensed-ok"; exit 1; }
          # 2) valid license -> ok
          mk 2099-01-01 "$T/valid"
          out="$(AIRLOCK_LICENSE_DIR="$T/valid" AIRLOCK_LICENSE_SELFTEST=1 "$bin" stats)"
          [ "$out" = "license-ok" ] || { echo "FAIL: valid license rejected"; exit 1; }
          # 3) expired -> blocked, fail-loud
          mk 2020-01-01 "$T/expired"
          if AIRLOCK_LICENSE_DIR="$T/expired" AIRLOCK_LICENSE_SELFTEST=1 "$bin" stats 2>"$T/err"; then
            echo "FAIL: expired license did not block"; exit 1
          fi
          grep -q 'license expired on 2020-01-01' "$T/err" || { echo "FAIL: no fail-loud expiry message"; cat "$T/err"; exit 1; }
          # 4) tampered content -> blocked
          mk 2099-01-01 "$T/tampered"
          sed -i 's/expiry=2099/expiry=2199/' "$T/tampered/license.txt"
          if AIRLOCK_LICENSE_DIR="$T/tampered" AIRLOCK_LICENSE_SELFTEST=1 "$bin" stats 2>"$T/err2"; then
            echo "FAIL: tampered license did not block"; exit 1
          fi
          grep -q 'verification FAILED' "$T/err2" || { echo "FAIL: no tamper message"; cat "$T/err2"; exit 1; }
          # 5) --version stays available even when expired (inspectability)
          AIRLOCK_LICENSE_DIR="$T/expired" "$bin" --version >/dev/null
          echo "license gate self-test OK (off/valid/expired/tampered/version-exempt)"

      - name: Package airlock-engine artifacts (5 target platforms)
        run: |
          set -euo pipefail
          mkdir -p out
          for plat in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            d="packages/opencode/dist/opencode-${plat}/bin"
            if [ ! -d "$d" ]; then echo "missing build output for ${plat} ($d)"; exit 1; fi
            tar -C "$d" -czf "out/airlock-engine-${plat}.tar.gz" .
            ( cd out && sha256sum "airlock-engine-${plat}.tar.gz" > "airlock-engine-${plat}.tar.gz.sha256" )
          done
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.overlay_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* \
              --title "airlock engine $tag" \
              --notes "airlock-branded opencode engine built from $tag (overlay on opencode v${OPENCODE_VERSION})."
          fi
